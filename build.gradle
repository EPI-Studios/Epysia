import com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar

plugins {
    id 'java'
    id 'application'
    id 'com.gradleup.shadow' version '9.0.2'
}

group = 'fr.epistudio'
version = (project.findProperty('releaseVersion') ?: '1.0-SNAPSHOT').toString()

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << '-parameters'
}

application {
    mainClass = 'fr.epistudio.epysia.GameLauncher'
}

tasks.named('test', Test) {
    testLogging.showStandardStreams = true
    systemProperties System.getProperties().findAll {
        it.key.toString().startsWith('epysia.')
    }
    if (System.getProperty('epysia.jfr') != null) {
        jvmArgs "-XX:StartFlightRecording=settings=profile,dumponexit=true,filename=${System.getProperty('epysia.jfr')}"
    }
}

tasks.register('runGame', JavaExec) {
    group = 'application'
    description = 'Runs fr.epistudio.epysia.GameLauncher (engine standalone). Pass scene via -Pscene=/path/to/scene.epyscene'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'fr.epistudio.epysia.GameLauncher'
    jvmArgs += ['--enable-native-access=ALL-UNNAMED']
    systemProperties System.getProperties().findAll {
        it.key.toString().startsWith('epysia.')
    }
    def scene = project.findProperty('scene') ?: '/tmp/epysia-scene.epyscene'
    def project_ = project.findProperty('projectRoot') ?: ''
    def channel = project.findProperty('channel') ?: ''
    def title = project.findProperty('title') ?: 'Epysia - Game'
    args = ['--scene', scene, '--title', title]
    if (project.hasProperty('width')) args += ['--width', project.findProperty('width')]
    if (project.hasProperty('height')) args += ['--height', project.findProperty('height')]
    if (project.hasProperty('precompiledScripts')) {
        args += ['--precompiled-scripts', project.findProperty('precompiledScripts')]
    }
    if (project_) args += ['--project', project_]
    if (channel == 'stdio') args += ['--runtime-channel=stdio']
}

tasks.register('translateShaders', JavaExec) {
    group = 'verification'
    description = 'Translates every engine GLSL shader to SPIR-V and reports failures.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'fr.epistudio.epysia.render.vulkan.ShaderTranslationReport'
    jvmArgs += ['--enable-native-access=ALL-UNNAMED']
}

tasks.register('syncPhysicsNatives', Copy) {
    group = 'build setup'
    description = 'Copies freshly built box3d natives from the box3d-java checkout into src/main/resources'
    def source = [
            file('box3d-java/natives'),
            file('../box3d-java/natives'),
            System.getenv('BOX3D_JAVA_HOME') == null ? null : file("${System.getenv('BOX3D_JAVA_HOME')}/natives")
    ].findAll { it != null }.find { it.isDirectory() }
    onlyIf { source != null }
    if (source != null) {
        from source
    }
    into 'src/main/resources/natives'
}

tasks.register('runServer', JavaExec) {
    group = 'application'
    description = 'Runs a dedicated headless server.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'fr.epistudio.epysia.GameLauncher'
    jvmArgs += ['--enable-native-access=ALL-UNNAMED']
    def scene = project.findProperty('scene') ?: '/tmp/epysia-scene.epyscene'
    def project_ = project.findProperty('projectRoot') ?: ''
    def port = project.findProperty('port') ?: '7777'
    def metricsPort = project.findProperty('metricsPort') ?: '0'
    args = ['--scene', scene, '--server', '--port', port.toString(),
            '--metrics-port', metricsPort.toString()]
    if (project_) args += ['--project', project_]
}

repositories {
    mavenCentral()
    maven {
        name = 'henkelmax.public'
        url = 'https://maven.maxhenkel.de/repository/public'
        content { includeGroupByRegex 'de\\.maxhenkel.*' }
    }
}

static String hostLwjglNatives() {
    String osName = System.getProperty('os.name').toLowerCase()
    if (osName.contains('win')) {
        return 'natives-windows'
    }
    if (osName.contains('mac') || osName.contains('darwin')) {
        return 'natives-macos'
    }
    return 'natives-linux'
}

ext {
    lwjglVersion = '3.3.6'
    lwjglNatives = (project.findProperty('lwjglNatives') ?: hostLwjglNatives()).toString()
}

dependencies {
    implementation 'com.meekdev:box3d-java:0.1.0'
    implementation 'org.joml:joml:1.10.8'
    implementation 'io.github.classgraph:classgraph:4.8.180'

    implementation platform("org.lwjgl:lwjgl-bom:${lwjglVersion}")
    implementation 'org.lwjgl:lwjgl'
    implementation 'org.lwjgl:lwjgl-glfw'
    implementation 'org.lwjgl:lwjgl-opengl'
    implementation 'org.lwjgl:lwjgl-vulkan'
    implementation 'org.lwjgl:lwjgl-vma'
    implementation 'org.lwjgl:lwjgl-shaderc'
    implementation 'org.lwjgl:lwjgl-stb'
    implementation 'org.lwjgl:lwjgl-tinyexr'
    implementation 'org.lwjgl:lwjgl-openal'
    implementation 'org.lwjgl:lwjgl-opus'
    implementation 'de.maxhenkel.speex4j:speex4j:1.0.3'
    implementation 'de.maxhenkel.rnnoise4j:rnnoise4j:2.1.3'
    implementation 'de.maxhenkel.lame4j:lame4j:2.1.5'
    implementation 'com.code-disaster.steamworks4j:steamworks4j:1.10.0'
    implementation 'com.code-disaster.steamworks4j:steamworks4j-lwjgl3:1.10.0'
    implementation 'org.recast4j:recast:1.5.12'
    implementation 'org.recast4j:detour:1.5.12'
    implementation 'org.recast4j:detour-crowd:1.5.12'
    runtimeOnly "org.lwjgl:lwjgl::${lwjglNatives}"
    runtimeOnly "org.lwjgl:lwjgl-glfw::${lwjglNatives}"
    runtimeOnly "org.lwjgl:lwjgl-opengl::${lwjglNatives}"
    runtimeOnly "org.lwjgl:lwjgl-vma::${lwjglNatives}"
    runtimeOnly "org.lwjgl:lwjgl-shaderc::${lwjglNatives}"
    if (lwjglNatives == 'natives-macos' || lwjglNatives == 'natives-macos-arm64') {
        runtimeOnly "org.lwjgl:lwjgl-vulkan::${lwjglNatives}"
    }
    runtimeOnly "org.lwjgl:lwjgl-stb::${lwjglNatives}"
    runtimeOnly "org.lwjgl:lwjgl-tinyexr::${lwjglNatives}"
    runtimeOnly "org.lwjgl:lwjgl-openal::${lwjglNatives}"
    runtimeOnly "org.lwjgl:lwjgl-opus::${lwjglNatives}"


    testImplementation platform('org.junit:junit-bom:6.0.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    jvmArgs '--enable-native-access=ALL-UNNAMED'
}

tasks.register('engineRuntimeJar', ShadowJar) {
    group = 'distribution'
    description = 'Fat jar for the game export template: engine, runtime libraries, and host-OS natives.'
    archiveBaseName = 'epysia-engine'
    archiveClassifier = ''
    archiveVersion = ''
    from sourceSets.main.output
    configurations = [project.configurations.runtimeClasspath]
    manifest {
        attributes 'Main-Class': 'fr.epistudio.epysia.GameLauncher'
    }
    mergeServiceFiles()
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    exclude 'models/magnusson/**'
    def target = (project.findProperty('exportTarget') ?: 'linux-x64').toString()
    if (target.startsWith('linux')) {
        exclude 'windows/**', 'macos/**', 'macosx/**', 'natives/windows-x64/**', 'natives/macos*/**'
    } else if (target.startsWith('windows')) {
        exclude 'linux/**', 'macos/**', 'macosx/**', 'natives/linux-x64/**', 'natives/macos*/**'
    }
}

tasks.withType(JavaExec).configureEach {
    systemProperties System.getProperties().findAll {
        String key = it.key.toString()
        key.startsWith('epysia.') || key.startsWith('bkun.')
    }
    if (name.endsWith('Check')) {
        systemProperty 'epysia.offscreen', 'true'
    }
}


tasks.register('printRuntimeClasspath') {
    group = 'verification'
    description = 'Prints the runtime classpath for launching the engine outside Gradle.'
    doLast {
        println sourceSets.main.runtimeClasspath.asPath
    }
}
