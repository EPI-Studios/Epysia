import com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar

plugins {
    id 'java'
    id 'application'
    id 'com.gradleup.shadow' version '8.3.5'
}

group = 'fr.epistudio'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

application {
    mainClass = 'com.meekdev.psyhou.game.PsyhouMain'
}

sourceSets {
    example {
        java {
            srcDirs = ['examples/java']
        }
        resources {
            srcDirs = ['examples/resources']
        }
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

configurations {
    exampleImplementation.extendsFrom implementation
    exampleRuntimeOnly.extendsFrom runtimeOnly
}

tasks.named('run', JavaExec) {
    classpath = sourceSets.example.runtimeClasspath
    mainClass = 'com.meekdev.psyhou.game.PsyhouMain'
    jvmArgs += ['--enable-native-access=ALL-UNNAMED']
}

repositories {
    mavenCentral()
}

ext {
    lwjglVersion = '3.3.6'
    lwjglNatives = 'natives-linux'
    lwjglJarNatives = (project.findProperty('lwjglJarNatives') ?: 'natives-windows').toString()
}

configurations {
    psyhouNatives
}

dependencies {
    implementation 'org.joml:joml:1.10.8'
    implementation 'io.github.classgraph:classgraph:4.8.180'

    implementation platform("org.lwjgl:lwjgl-bom:${lwjglVersion}")
    implementation 'org.lwjgl:lwjgl'
    implementation 'org.lwjgl:lwjgl-glfw'
    implementation 'org.lwjgl:lwjgl-opengl'
    implementation 'org.lwjgl:lwjgl-stb'
    implementation 'org.lwjgl:lwjgl-openal'
    runtimeOnly "org.lwjgl:lwjgl::${lwjglNatives}"
    runtimeOnly "org.lwjgl:lwjgl-glfw::${lwjglNatives}"
    runtimeOnly "org.lwjgl:lwjgl-opengl::${lwjglNatives}"
    runtimeOnly "org.lwjgl:lwjgl-stb::${lwjglNatives}"
    runtimeOnly "org.lwjgl:lwjgl-openal::${lwjglNatives}"

    psyhouNatives platform("org.lwjgl:lwjgl-bom:${lwjglVersion}")
    psyhouNatives "org.lwjgl:lwjgl::${lwjglJarNatives}"
    psyhouNatives "org.lwjgl:lwjgl-glfw::${lwjglJarNatives}"
    psyhouNatives "org.lwjgl:lwjgl-opengl::${lwjglJarNatives}"
    psyhouNatives "org.lwjgl:lwjgl-stb::${lwjglJarNatives}"
    psyhouNatives "org.lwjgl:lwjgl-openal::${lwjglJarNatives}"

    testImplementation platform('org.junit:junit-bom:6.0.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

ext.physicsNativesProjectDir = file('physics-natives')
ext.physicsNativesResourceDir = file('src/main/resources/natives')

ext.physicsNativesTargets = [
        [triple: 'x86_64-unknown-linux-gnu',  resource: 'linux-x64',   lib: 'librapier_moud.so',     tool: 'cargo'],
        [triple: 'aarch64-unknown-linux-gnu', resource: 'linux-arm64', lib: 'librapier_moud.so',     tool: 'zigbuild'],
        [triple: 'x86_64-pc-windows-gnu',     resource: 'windows-x64', lib: 'rapier_moud.dll',       tool: 'cargo'],
        [triple: 'x86_64-apple-darwin',       resource: 'macos-x64',   lib: 'librapier_moud.dylib',  tool: 'zigbuild'],
        [triple: 'aarch64-apple-darwin',      resource: 'macos-arm64', lib: 'librapier_moud.dylib',  tool: 'zigbuild'],
]

ext.resolveCargoExecutable = {
    String exeName = System.getProperty('os.name').toLowerCase().contains('windows') ? 'cargo.exe' : 'cargo'
    String pathValue = System.getenv('PATH') ?: ''
    for (String dir : pathValue.split(File.pathSeparator)) {
        if (dir == null || dir.isBlank()) continue
        File candidate = new File(dir, exeName)
        if (candidate.isFile() && candidate.canExecute()) return candidate.absolutePath
    }
    File rustupCargo = new File("${System.getProperty('user.home')}/.cargo/bin/${exeName}")
    if (rustupCargo.isFile() && rustupCargo.canExecute()) return rustupCargo.absolutePath
    return exeName
}

ext.detectHostTriple = {
    String os = System.getProperty('os.name').toLowerCase()
    String arch = System.getProperty('os.arch').toLowerCase()
    boolean arm = arch.contains('aarch64') || arch.contains('arm64')
    if (os.contains('linux'))   return arm ? 'aarch64-unknown-linux-gnu' : 'x86_64-unknown-linux-gnu'
    if (os.contains('mac'))     return arm ? 'aarch64-apple-darwin'      : 'x86_64-apple-darwin'
    if (os.contains('windows')) return 'x86_64-pc-windows-gnu'
    throw new GradleException("Unsupported host platform: ${os}/${arch}")
}

tasks.register('physicsNativesBuild', Exec) {
    group = 'physics'
    description = 'Builds the Rapier native library for the host platform and copies it into src/main/resources/natives.'
    workingDir = physicsNativesProjectDir
    Map target = physicsNativesTargets.find { it.triple == detectHostTriple() }
    commandLine resolveCargoExecutable(), 'build', '--release', '--target', target.triple
    doLast {
        File source = new File(physicsNativesProjectDir, "target/${target.triple}/release/${target.lib}")
        File destinationDir = new File(physicsNativesResourceDir, target.resource)
        destinationDir.mkdirs()
        ant.copy(file: source.absolutePath, todir: destinationDir.absolutePath, overwrite: true)
        logger.lifecycle("Copied ${source.name} -> ${destinationDir}")
    }
}

tasks.register('physicsNativesCrossBuild') {
    group = 'physics'
    description = 'Builds the Rapier native library for all supported targets (cargo + cargo-zigbuild) and copies them into src/main/resources/natives.'
    doLast {
        String cargo = resolveCargoExecutable()
        physicsNativesTargets.each { target ->
            try {
                exec {
                    workingDir = physicsNativesProjectDir
                    if (target.tool == 'zigbuild') {
                        commandLine cargo, 'zigbuild', '--release', '--target', target.triple
                    } else {
                        commandLine cargo, 'build', '--release', '--target', target.triple
                    }
                }
                File source = new File(physicsNativesProjectDir, "target/${target.triple}/release/${target.lib}")
                File destinationDir = new File(physicsNativesResourceDir, target.resource)
                destinationDir.mkdirs()
                ant.copy(file: source.absolutePath, todir: destinationDir.absolutePath, overwrite: true)
                logger.lifecycle("Built ${target.triple} -> ${destinationDir}/${target.lib}")
            } catch (Exception failure) {
                logger.warn("Skipped ${target.triple} via ${target.tool}: ${failure.message}")
            }
        }
    }
}

tasks.register('psyhouJar', ShadowJar) {
    group = 'distribution'
    description = 'Builds a runnable fat jar of the Psyhou example for the target platform (default: windows)'
    archiveBaseName = 'psyhou'
    archiveClassifier = lwjglJarNatives.replace('natives-', '')
    from sourceSets.example.output
    from sourceSets.main.output
    configurations = [
            project.configurations.exampleRuntimeClasspath,
            project.configurations.psyhouNatives
    ]
    exclude { details ->
        def name = details.path
        def isLwjglNative = name.contains('lwjgl') && (name.endsWith('.so') || name.endsWith('.dylib') || name.endsWith('.dll'))
        def keep = name.contains(lwjglJarNatives.replace('natives-', ''))
        return isLwjglNative && !keep
    }
    manifest {
        attributes 'Main-Class': 'com.meekdev.psyhou.game.PsyhouMain'
    }
    mergeServiceFiles()
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
