tasks.register('runGame', JavaExec) {
    group = 'application'
    description = 'Runs fr.epistudio.epysia.GameLauncher (engine standalone). Pass scene via -Pscene=/path/to/scene.epyscene'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'fr.epistudio.epysia.GameLauncher'
    jvmArgs += ['--enable-native-access=ALL-UNNAMED']
    def scene = project.findProperty('scene') ?: '/tmp/epysia-scene.epyscene'
    def project_ = project.findProperty('projectRoot') ?: ''
    def channel = project.findProperty('channel') ?: ''
    def title = project.findProperty('title') ?: 'Epysia - Game'
    args = ['--scene', scene, '--title', title]
    if (project_) args += ['--project', project_]
    if (channel == 'stdio') args += ['--runtime-channel=stdio']
}

repositories {
    mavenCentral()
}

static String hostLwjglNatives() {
    String osName = System.getProperty('os.name').toLowerCase()
    if (osName.contains('win')) {
        return 'natives-windows'
    }
    if (osName.contains('mac') || osName.contains('darwin')) {
        return 'natives-macos'
    }
    return 'natives-linux'
}

ext {
    lwjglVersion = '3.3.6'
    lwjglNatives = (project.findProperty('lwjglNatives') ?: hostLwjglNatives()).toString()
    lwjglJarNatives = (project.findProperty('lwjglJarNatives') ?: 'natives-windows').toString()
}

configurations {
    psyhouNatives
}

dependencies {
    implementation 'org.joml:joml:1.10.8'
    implementation 'io.github.classgraph:classgraph:4.8.180'

    implementation platform("org.lwjgl:lwjgl-bom:${lwjglVersion}")
    implementation 'org.lwjgl:lwjgl'
    implementation 'org.lwjgl:lwjgl-glfw'
    implementation 'org.lwjgl:lwjgl-opengl'
    implementation 'org.lwjgl:lwjgl-stb'
    implementation 'org.lwjgl:lwjgl-openal'
    runtimeOnly "org.lwjgl:lwjgl::${lwjglNatives}"
    runtimeOnly "org.lwjgl:lwjgl-glfw::${lwjglNatives}"
    runtimeOnly "org.lwjgl:lwjgl-opengl::${lwjglNatives}"
    runtimeOnly "org.lwjgl:lwjgl-stb::${lwjglNatives}"
    runtimeOnly "org.lwjgl:lwjgl-openal::${lwjglNatives}"

    psyhouNatives platform("org.lwjgl:lwjgl-bom:${lwjglVersion}")
    psyhouNatives "org.lwjgl:lwjgl::${lwjglJarNatives}"
    psyhouNatives "org.lwjgl:lwjgl-glfw::${lwjglJarNatives}"
    psyhouNatives "org.lwjgl:lwjgl-opengl::${lwjglJarNatives}"
    psyhouNatives "org.lwjgl:lwjgl-stb::${lwjglJarNatives}"
    psyhouNatives "org.lwjgl:lwjgl-openal::${lwjglJarNatives}"

    testImplementation platform('org.junit:junit-bom:6.0.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

tasks.register('engineRuntimeJar', ShadowJar) {
    group = 'distribution'
    description = 'Fat jar for the game export template: engine, runtime libraries, and host-OS natives.'
    archiveBaseName = 'epysia-engine'
    archiveClassifier = ''
    archiveVersion = ''
    from sourceSets.main.output
    configurations = [project.configurations.runtimeClasspath]
    manifest {
        attributes 'Main-Class': 'fr.epistudio.epysia.GameLauncher'
    }
    mergeServiceFiles()
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.register('psyhouJar', ShadowJar) {
    group = 'distribution'
    description = 'Builds a runnable fat jar of the Psyhou example for the target platform (default: windows)'
    archiveBaseName = 'psyhou'
    archiveClassifier = lwjglJarNatives.replace('natives-', '')
    from sourceSets.example.output
    from sourceSets.main.output
    configurations = [
            project.configurations.exampleRuntimeClasspath,
            project.configurations.psyhouNatives
    ]
    exclude { details ->
        def name = details.path
        def isLwjglNative = name.contains('lwjgl') && (name.endsWith('.so') || name.endsWith('.dylib') || name.endsWith('.dll'))
        def keep = name.contains(lwjglJarNatives.replace('natives-', ''))
        return isLwjglNative && !keep
    }
    manifest {
        attributes 'Main-Class': 'com.meekdev.psyhou.game.PsyhouMain'
    }
    mergeServiceFiles()
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.withType(JavaExec).configureEach {
    systemProperties System.getProperties().findAll { it.key.toString().startsWith('epysia.') }
}

tasks.register('runEmbersScreenshot', JavaExec) {
    group = 'verification'
    description = 'Saves a PNG of the embers render for inspection.'
    classpath = sourceSets.example.runtimeClasspath
    mainClass = 'com.meekdev.psyhou.game.EmbersScreenshot'
    jvmArgs += ['--enable-native-access=ALL-UNNAMED']
}

tasks.withType(JavaExec).configureEach {
    if (name.endsWith('Check') || name.endsWith('Screenshot')) {
        systemProperty 'epysia.offscreen', 'true'
    }
}
