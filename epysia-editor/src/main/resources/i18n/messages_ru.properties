editor.materials-section.animate-shadow-tooltip=Влияет только на материалы с поверхностным шейдером, анимированным по времени.\nВкл: тень следует за анимацией, поэтому не кешируется и перерисовывается каждый кадр.\nВыкл: тень заморожена в момент времени 0, а освещаемый мэш продолжает анимироваться, поэтому тень можно кешировать.
# MaterialsSection
editor.materials-section.alpha-scissor-tooltip=Значение альфа-отсечения выше нуля отбрасывает фрагменты вместо их смешивания.\nМатериал остаётся в очереди непрозрачных, продолжает записывать глубину, может быть инстансирован и может отбрасывать тени.\nСмешивание используется только при нулевом значении отсечения.
# MaterialsSection
editor.materials-section.receive-shadows-tooltip=Выкл: материал никогда не сэмплирует карту теней, поэтому весь поиск теней исчезает из фрагментного шейдера.\nНа густой растительности это одна из самых больших экономий на фрагментах.
