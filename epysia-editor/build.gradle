import com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar

plugins {
    id 'java'
    id 'application'
    id 'com.gradleup.shadow' version '9.0.2'
}

group = 'fr.epistudio'
version = rootProject.version

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        name = 'henkelmax.public'
        url = 'https://maven.maxhenkel.de/repository/public'
        content { includeGroupByRegex 'de\\.maxhenkel.*' }
    }
}

if (rootProject == project) {
    throw new GradleException("epysia-editor is a subproject of Epysia and cannot be built on its own. "
            + "Open or build from the repository root, for example: gradlew :epysia-editor:run")
}

ext {
    lwjglVersion = rootProject.ext.lwjglVersion
    lwjglNatives = rootProject.ext.lwjglNatives
    imguiVersion = 'fork'
    imguiNativesDirectory = [
            rootProject.file('imgui-java/bin'),
            rootProject.file('../imgui-java/bin'),
            System.getenv('IMGUI_JAVA_HOME') == null ? null : file("${System.getenv('IMGUI_JAVA_HOME')}/bin")
    ].findAll { it != null }.find { it.directory }
}

dependencies {
    implementation rootProject

    implementation 'org.joml:joml:1.10.8'

    implementation "io.github.spair:imgui-java-binding:${imguiVersion}"
    implementation "io.github.spair:imgui-java-lwjgl3:${imguiVersion}"

    implementation 'de.javagl:jgltf-model:2.0.4'
    implementation 'org.apache.maven.resolver:maven-resolver-supplier:1.9.22'
    implementation 'org.jetbrains.kotlin:kotlin-compiler-embeddable:2.2.20'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.2.20'

    testImplementation platform('org.junit:junit-bom:6.0.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    implementation platform("org.lwjgl:lwjgl-bom:${lwjglVersion}")
    implementation 'org.lwjgl:lwjgl'
    implementation 'org.lwjgl:lwjgl-glfw'
    implementation 'org.lwjgl:lwjgl-opengl'
    implementation 'org.lwjgl:lwjgl-stb'
    implementation 'org.lwjgl:lwjgl-tinyfd'
    runtimeOnly "org.lwjgl:lwjgl::${lwjglNatives}"
    runtimeOnly "org.lwjgl:lwjgl-glfw::${lwjglNatives}"
    runtimeOnly "org.lwjgl:lwjgl-opengl::${lwjglNatives}"
    runtimeOnly "org.lwjgl:lwjgl-stb::${lwjglNatives}"
    runtimeOnly "org.lwjgl:lwjgl-tinyfd::${lwjglNatives}"
}

application {
    mainClass = 'fr.epistudio.epysia.editor.EditorMain'
}

test {
    useJUnitPlatform()
}

tasks.named('run', JavaExec) {
    classpath = files(rootProject.sourceSets.main.output) + sourceSets.main.runtimeClasspath
    mainClass = 'fr.epistudio.epysia.editor.EditorMain'
    def crashReports = new File(System.getProperty('user.home'), '.epysia/crash-reports')
    crashReports.mkdirs()
    jvmArgs += ['--enable-native-access=ALL-UNNAMED',
                "-XX:ErrorFile=${crashReports}/hs_err_pid%p.log".toString(),
                '-XX:+HeapDumpOnOutOfMemoryError',
                "-XX:HeapDumpPath=${crashReports}".toString()]
    systemProperty 'epysia.gpu.profiling', 'true'
    if (imguiNativesDirectory != null) {
        systemProperty 'imgui.library.path', imguiNativesDirectory.absolutePath
        doFirst { verifyImguiNativesMatchBinding(imguiNativesDirectory) }
    }
    systemProperties System.getProperties().findAll { it.key.toString().startsWith('epysia.') }
}

def buildInfoDirectory = layout.buildDirectory.dir('generated/build-info')
def templateRepository = (project.findProperty('templateRepository') ?: 'EPI-Studios/Epysia').toString()

tasks.register('generateBuildInfo') {
    def outputFile = buildInfoDirectory.get().file('editor-build.properties').asFile
    def resolvedVersion = project.version.toString()
    inputs.property('version', resolvedVersion)
    inputs.property('repository', templateRepository)
    outputs.file(outputFile)
    doLast {
        outputFile.parentFile.mkdirs()
        outputFile.text = "version=${resolvedVersion}\nrepository=${templateRepository}\n"
    }
}

sourceSets.main.resources.srcDir(buildInfoDirectory)
tasks.named('processResources') {
    dependsOn 'generateBuildInfo'
}

tasks.register('editorJar', ShadowJar) {
    group = 'distribution'
    description = 'Fat jar for the editor installer: engine, editor, Dear ImGui, and host-OS natives.'
    archiveBaseName = 'epysia-editor'
    archiveClassifier = ''
    archiveVersion = ''
    from sourceSets.main.output
    configurations = [project.configurations.runtimeClasspath]
    manifest {
        attributes 'Main-Class': 'fr.epistudio.epysia.editor.EditorMain'
    }
    mergeServiceFiles()
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.register('importAssets', JavaExec) {
    group = 'distribution'
    description = 'Imports glTF or GLB files into engine assets without opening the editor.'
    classpath = files(rootProject.sourceSets.main.output) + sourceSets.main.runtimeClasspath
    mainClass = 'fr.epistudio.epysia.editor.EditorMain'
    jvmArgs += ['--enable-native-access=ALL-UNNAMED']
    doFirst {
        def sources = project.findProperty('importSource')
        if (!sources) {
            throw new GradleException('importAssets needs -PimportSource=<file or directory>, '
                    + 'separate several with a comma.')
        }
        args = sources.toString().split(',').collectMany { ['--import', it.trim()] }
    }
}

tasks.register('exportGame', JavaExec) {
    group = 'distribution'
    description = 'Exports a project to a runnable game folder without opening the editor.'
    classpath = files(rootProject.sourceSets.main.output) + sourceSets.main.runtimeClasspath
    mainClass = 'fr.epistudio.epysia.editor.EditorMain'
    jvmArgs += ['--enable-native-access=ALL-UNNAMED']
    doFirst {
        def gameProject = project.findProperty('exportProject')
        def output = project.findProperty('exportOutput')
        if (!gameProject || !output) {
            throw new GradleException('exportGame needs -PexportProject=<directory> and '
                    + '-PexportOutput=<directory>.')
        }
        args = ['--export', output.toString(), '--project', gameProject.toString(),
                '--title', (project.findProperty('exportTitle') ?: 'Epysia Game').toString(),
                '--platform', (project.findProperty('exportPlatform') ?: 'linux-x64').toString()]
        def icon = project.findProperty('exportIcon')
        if (icon) args += ['--icon', icon.toString()]
    }
}

/// The natives and the Java binding are built together in the imgui-java fork. A checkout that is
/// behind loads a native missing whatever the binding gained since, which surfaces as an
/// UnsatisfiedLinkError on a random method deep inside ImGui setup. bin/binding.sha1 is the fork's
/// own record of what the natives were built from, so comparing against it says so plainly instead.
def verifyImguiNativesMatchBinding(File nativesDirectory) {
    File manifest = new File(nativesDirectory, 'binding.sha1')
    if (!manifest.isFile()) {
        return
    }
    File root = nativesDirectory.parentFile
    List<String> stale = []
    manifest.eachLine('UTF-8') { line ->
        int separator = line.indexOf('  ')
        if (separator < 0) {
            return
        }
        String expected = line.substring(0, separator)
        File source = new File(root, line.substring(separator + 2))
        if (source.isFile() && sha1Of(source) != expected) {
            stale << source.name
        }
    }
    if (!stale.isEmpty()) {
        throw new GradleException(
                "The imgui-java natives in ${nativesDirectory} were built from older binding sources, "
                        + "so the editor would die on a missing native method.\n"
                        + "Changed since the natives were built: ${stale.take(5).join(', ')}"
                        + (stale.size() > 5 ? " and ${stale.size() - 5} more" : '') + "\n"
                        + "Pull the imgui-java fork, or rebuild its natives and regenerate bin/binding.sha1.")
    }
}

def sha1Of(File file) {
    java.security.MessageDigest digest = java.security.MessageDigest.getInstance('SHA-1')
    file.withInputStream { stream ->
        byte[] buffer = new byte[65536]
        int read
        while ((read = stream.read(buffer)) > 0) {
            digest.update(buffer, 0, read)
        }
    }
    return digest.digest().encodeHex().toString()
}
