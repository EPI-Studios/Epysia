import com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar

plugins {
    id 'java'
    id 'application'
    id 'com.gradleup.shadow' version '9.0.2'
}

group = 'fr.epistudio'
version = rootProject.version

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        name = 'henkelmax.public'
        url = 'https://maven.maxhenkel.de/repository/public'
        content { includeGroupByRegex 'de\\.maxhenkel.*' }
    }
}

if (rootProject == project) {
    throw new GradleException("epysia-editor is a subproject of Epysia and cannot be built on its own. "
            + "Open or build from the repository root, for example: gradlew :epysia-editor:run")
}

ext {
    lwjglVersion = rootProject.ext.lwjglVersion
    lwjglNatives = rootProject.ext.lwjglNatives
    imguiVersion = '1.87.7'
}

dependencies {
    implementation rootProject

    implementation 'org.joml:joml:1.10.8'

    implementation "io.github.spair:imgui-java-binding:${imguiVersion}"
    implementation "io.github.spair:imgui-java-lwjgl3:${imguiVersion}"
    runtimeOnly "io.github.spair:imgui-java-natives-linux:${imguiVersion}"
    runtimeOnly "io.github.spair:imgui-java-natives-windows:${imguiVersion}"
    runtimeOnly "io.github.spair:imgui-java-natives-macos:${imguiVersion}"

    implementation 'de.javagl:jgltf-model:2.0.4'
    implementation 'org.apache.maven.resolver:maven-resolver-supplier:1.9.22'
    implementation 'org.jetbrains.kotlin:kotlin-compiler-embeddable:2.2.20'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.2.20'

    testImplementation platform('org.junit:junit-bom:6.0.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    implementation platform("org.lwjgl:lwjgl-bom:${lwjglVersion}")
    implementation 'org.lwjgl:lwjgl'
    implementation 'org.lwjgl:lwjgl-glfw'
    implementation 'org.lwjgl:lwjgl-opengl'
    implementation 'org.lwjgl:lwjgl-stb'
    implementation 'org.lwjgl:lwjgl-tinyfd'
    runtimeOnly "org.lwjgl:lwjgl::${lwjglNatives}"
    runtimeOnly "org.lwjgl:lwjgl-glfw::${lwjglNatives}"
    runtimeOnly "org.lwjgl:lwjgl-opengl::${lwjglNatives}"
    runtimeOnly "org.lwjgl:lwjgl-stb::${lwjglNatives}"
    runtimeOnly "org.lwjgl:lwjgl-tinyfd::${lwjglNatives}"
}

application {
    mainClass = 'fr.epistudio.epysia.editor.EditorMain'
}

test {
    useJUnitPlatform()
}

tasks.named('run', JavaExec) {
    classpath = files(rootProject.sourceSets.main.output) + sourceSets.main.runtimeClasspath
    mainClass = 'fr.epistudio.epysia.editor.EditorMain'
    jvmArgs += ['--enable-native-access=ALL-UNNAMED']
    systemProperty 'epysia.gpu.profiling', 'true'
    systemProperties System.getProperties().findAll { it.key.toString().startsWith('epysia.') }
}

def buildInfoDirectory = layout.buildDirectory.dir('generated/build-info')
def templateRepository = (project.findProperty('templateRepository') ?: 'EPI-Studios/Epysia').toString()

tasks.register('generateBuildInfo') {
    def outputFile = buildInfoDirectory.get().file('editor-build.properties').asFile
    def resolvedVersion = project.version.toString()
    inputs.property('version', resolvedVersion)
    inputs.property('repository', templateRepository)
    outputs.file(outputFile)
    doLast {
        outputFile.parentFile.mkdirs()
        outputFile.text = "version=${resolvedVersion}\nrepository=${templateRepository}\n"
    }
}

sourceSets.main.resources.srcDir(buildInfoDirectory)
tasks.named('processResources') {
    dependsOn 'generateBuildInfo'
}

tasks.register('editorJar', ShadowJar) {
    group = 'distribution'
    description = 'Fat jar for the editor installer: engine, editor, Dear ImGui, and host-OS natives.'
    archiveBaseName = 'epysia-editor'
    archiveClassifier = ''
    archiveVersion = ''
    from sourceSets.main.output
    configurations = [project.configurations.runtimeClasspath]
    manifest {
        attributes 'Main-Class': 'fr.epistudio.epysia.editor.EditorMain'
    }
    mergeServiceFiles()
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.register('exportGame', JavaExec) {
    group = 'distribution'
    description = 'Exports a project to a runnable game folder without opening the editor.'
    classpath = files(rootProject.sourceSets.main.output) + sourceSets.main.runtimeClasspath
    mainClass = 'fr.epistudio.epysia.editor.EditorMain'
    jvmArgs += ['--enable-native-access=ALL-UNNAMED']
    doFirst {
        def gameProject = project.findProperty('exportProject')
        def output = project.findProperty('exportOutput')
        if (!gameProject || !output) {
            throw new GradleException('exportGame needs -PexportProject=<directory> and '
                    + '-PexportOutput=<directory>.')
        }
        args = ['--export', output.toString(), '--project', gameProject.toString(),
                '--title', (project.findProperty('exportTitle') ?: 'Epysia Game').toString(),
                '--platform', (project.findProperty('exportPlatform') ?: 'linux-x64').toString()]
        def icon = project.findProperty('exportIcon')
        if (icon) args += ['--icon', icon.toString()]
    }
}
