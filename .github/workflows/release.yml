name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version without the leading v
        required: true
        default: 0.0.1

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
            lwjgl: natives-linux
            box3d_lib: libbox3d.so
            vhacd_lib: libbkunvhacd.so
          - os: windows-latest
            target: windows-x64
            lwjgl: natives-windows
            box3d_lib: box3d.dll
            vhacd_lib: bkunvhacd.dll
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            ref="${{ github.ref_name }}"
            echo "value=${ref#v}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Keep line endings verbatim
        shell: bash
        run: git config --global core.autocrlf false

      - name: Checkout imgui-java
        uses: actions/checkout@v4
        with:
          repository: Meekiavelique/imgui-java
          submodules: recursive
          path: imgui-java

      - name: Verify imgui natives
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Linux) native=libimgui-java64.so ;;
            Windows) native=imgui-java64.dll ;;
            macOS) native=libimgui-java64.dylib ;;
          esac
          if [ ! -f "imgui-java/bin/$native" ]; then
            echo "::error::imgui-java/bin/$native is missing, the editor cannot run on ${{ runner.os }}"
            ls -la imgui-java/bin || true
            exit 1
          fi
          echo "found imgui-java/bin/$native"
          if [ ! -f imgui-java/bin/binding.sha1 ]; then
            echo "::error::imgui-java/bin/binding.sha1 is missing, the natives cannot be matched to the binding"
            exit 1
          fi
          stale=$( { cd imgui-java && sha1sum -c bin/binding.sha1 --quiet 2>/dev/null || true; } | cut -d: -f1 )
          if [ -n "$stale" ]; then
            echo "::error::the imgui natives were built from different binding sources, so $native is stale"
            echo "::error::rebuild the natives in the imgui-java fork and regenerate bin/binding.sha1"
            echo "changed since the natives were built:"
            echo "$stale"
            exit 1
          fi
          echo "natives match the binding sources"

      - name: Checkout box3d-java
        uses: actions/checkout@v4
        with:
          repository: Meekiavelique/box3d-java
          submodules: recursive
          path: box3d-java

      - name: Graft rollback sources into box3d
        shell: bash
        working-directory: box3d-java
        run: ./gradlew graftRollbackSources

      - name: Build box3d natives
        shell: bash
        run: |
          cmake -B box3d-java/native/box3d/build -S box3d-java/native/box3d \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON -DBOX3D_DOUBLE_PRECISION=ON \
            -DBOX3D_SAMPLES=OFF -DBOX3D_UNIT_TESTS=OFF
          cmake --build box3d-java/native/box3d/build --target box3d --config Release
          cmake -B box3d-java/native/vhacd/build -S box3d-java/native/vhacd -DCMAKE_BUILD_TYPE=Release
          cmake --build box3d-java/native/vhacd/build --config Release

      - name: Stage box3d natives
        shell: bash
        run: |
          destination="src/main/resources/natives/${{ matrix.target }}"
          mkdir -p "$destination"
          find box3d-java/native/box3d/build -name '${{ matrix.box3d_lib }}' -exec cp {} "$destination/" \;
          find box3d-java/native/vhacd/build -name '${{ matrix.vhacd_lib }}' -exec cp {} "$destination/" \;
          ls -l "$destination"

      - name: Install WiX (Windows)
        if: matrix.os == 'windows-latest'
        run: choco install wixtoolset --no-progress -y

      - name: Install packaging tools (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y fakeroot binutils zip rpm

      - name: Build fat jars
        shell: bash
        run: |
          ./gradlew engineRuntimeJar :epysia-editor:editorJar \
            -PreleaseVersion=${{ steps.version.outputs.value }} \
            -PlwjglNatives=${{ matrix.lwjgl }}

      - name: Build language packs
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          ./gradlew :epysia-lang-kotlin:shadowJar :epysia-lang-kotlin:runtimeArchive \
            :epysia-lang-python:packArchive \
            -PreleaseVersion=${{ steps.version.outputs.value }}
          mkdir -p dist
          cp epysia-lang-kotlin/build/libs/epysia-lang-kotlin.jar \
            "dist/epysia-lang-kotlin-${{ steps.version.outputs.value }}.jar"
          cp epysia-lang-kotlin/build/runtime/epysia-lang-kotlin-runtime.jar \
            "dist/epysia-lang-kotlin-runtime-${{ steps.version.outputs.value }}.jar"
          cp epysia-lang-python/build/pack/epysia-lang-python.zip \
            "dist/epysia-lang-python-${{ steps.version.outputs.value }}.zip"

      - name: Write language pack catalogue
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: bash packaging/language-packs.sh

      - name: Package installers and template
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
          TARGET: ${{ matrix.target }}
        run: bash packaging/package.sh

      - name: Write checksums
        shell: bash
        run: cd dist && sha256sum * > checksums-${{ matrix.target }}.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
